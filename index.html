<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablosiu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fbfbfd; /* Kolor tła Apple */
            color: #1d1d1f;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Bardzo subtelne, niemal niewidoczne koło w tle */
        .bg-gradient {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(0, 102, 204, 0.03) 0%, transparent 70%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease-out forwards;
        }

        p {
            font-size: 1.25rem;
            color: #86868b;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease-out 0.2s forwards;
        }

        .cta-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease-out 0.4s forwards;
        }

        .btn {
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .btn-main {
            background: #0071e3; /* Niebieski Apple */
            color: white;
        }

        .btn-main:hover {
            background: #0077ed;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            color: #0066cc;
        }

        .btn-secondary:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pasek na dole */
        .footer-note {
            position: absolute;
            bottom: 40px;
            font-size: 0.8rem;
            color: #a1a1a6;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <main class="container">
        <h1>Pablosiu.</h1>
        <p>Tworzę proste rzeczy, które rozwiązują skomplikowane problemy.</p>
        
        <div class="cta-container">
            <a href="projekty.html" class="btn btn-main">Zobacz projekty</a>
            <a href="https://itspablosiu.github.io/bio/" class="btn btn-secondary">Dowiedz się więcej &gt;</a>
        </div>
    </main>

    <div class="footer-note">Designed for simplicity</div>

</body>
</html>
