<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablosiu - Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: white;
            min-height: 100vh;
            overflow: hidden; /* Home zazwyczaj nie wymaga scrolla */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ANIMOWANE TŁO --- */
        .bg-animate {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
        }

        .blob {
            position: absolute;
            width: 700px;
            height: 700px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.25;
            animation: move 20s infinite alternate ease-in-out;
        }

        .blob-2 {
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            right: -10%;
            bottom: -10%;
            animation: move 15s infinite alternate-reverse ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(10%, 10%) scale(1.1); }
        }

        /* --- GŁÓWNY KONTENER --- */
        .hero {
            max-width: 800px;
            padding: 60px 40px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Subtelny badge nad nagłówkiem */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 24px;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 800;
            line-height: 0.9;
            margin-bottom: 24px;
            letter-spacing: -4px;
            background: linear-gradient(to bottom, #fff 40%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            max-width: 550px;
            margin: 0 auto 48px;
            line-height: 1.6;
            font-weight: 300;
        }

        /* --- PRZYCISKI --- */
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }

        .cta-button {
            display: inline-block;
            padding: 18px 44px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .cta-button:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.15);
            background: #f8fafc;
        }

        .secondary-button {
            display: inline-block;
            padding: 18px 30px;
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 500;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .secondary-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Responsywność dla małych ekranów */
        @media (max-width: 600px) {
            .btn-group {
                flex-direction: column;
                width: 100%;
            }
            .cta-button, .secondary-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="bg-animate">
        <div class="blob"></div>
        <div class="blob-2"></div>
    </div>

    <section class="hero">
        <div class="badge">WITAJ W MOIM ŚWIECIE</div>
        <h1>Pablosiu</h1>
        <p>To nie jest zwykła strona. To Gówno stworzone przeze mnie, gdzie są moje dzieła.</p>
        
        <div class="btn-group">
            <a href="projekty.html" class="cta-button">Eksploruj Projekty</a>
            <a href="https://itspablosiu.github.io/bio/" target="_blank" class="secondary-button">Bio Link</a>
        </div>
    </section>

</body>
</html>
