<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablosiu - Home</title>
    <style>
        /* Nowoczesny font Outfit z większym zakresem wag */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            overflow-x: hidden;
            background: #060608; /* Nieco głębsza czerń */
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ANIMOWANE TŁO (Ulepszone) --- */
        .bg-animate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #060608 100%);
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.3; /* Subtelniejsza przezroczystość */
            animation: move 20s infinite alternate ease-in-out;
        }

        .blob-2 {
            background: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
            right: -5%;
            bottom: -5%;
            animation: move 15s infinite alternate-reverse ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-50px, -50px) scale(1) rotate(0deg); }
            to { transform: translate(100px, 100px) scale(1.2) rotate(45deg); }
        }

        /* --- GŁÓWNY KONTENER (Glassmorphism 2.0) --- */
        .glass-container {
            max-width: 700px;
            width: 90%;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        /* Efekt błysku na kontenerze */
        .glass-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            background: linear-gradient(to bottom, #ffffff 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: -3px;
        }

        p {
            color: #94a3b8;
            font-size: 1.2rem;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 40px;
            font-weight: 300;
        }

        /* --- PRZYCISK (Większa głębia) --- */
        .cta-button {
            display: inline-block;
            padding: 18px 45px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .cta-button:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
            background: #f8fafc;
        }

        /* Dodatkowy link pod przyciskiem dla balansu */
        .secondary-link {
            display: block;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .secondary-link:hover {
            color: #fff;
        }

    </style>
</head>
<body>

    <div class="bg-animate">
        <div class="blob"></div>
        <div class="blob-2"></div>
    </div>

    <div class="glass-container">
        <h1>Pablosiu</h1>
        <p>To nie jest zwykła strona. To gówno, gdzie znajdziesz moje dzieła.</p>
        
        <a href="projekty.html" class="cta-button">Zobacz moje projekty</a>
        
        <a href="https://itspablosiu.github.io/bio/" class="secondary-link">Przejdź do Bio Link →</a>
    </div>

</body>
</html>
