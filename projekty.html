<!DOCTYPE html>

<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pablosiu - Projekty</title>

    <style>

        /* Import fontu z Google Fonts */

        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap');



        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: 'Outfit', sans-serif;

        }



        body {

            overflow-x: hidden;

            background: #0a0a0c;

            color: white;

            min-height: 100vh;

        }



        /* Animowane tło */

        .bg-animate {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            z-index: -1;

            background: linear-gradient(45deg, #0a0a0c, #1a1a2e);

        }



        .blob {

            position: absolute;

            width: 500px;

            height: 500px;

            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);

            filter: blur(80px);

            border-radius: 50%;

            z-index: -1;

            opacity: 0.4;

            animation: move 20s infinite alternate;

        }



        .blob-2 {

            background: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);

            right: -100px;

            bottom: -100px;

            animation: move 15s infinite alternate-reverse;

        }



        @keyframes move {

            from { transform: translate(0, 0) scale(1); }

            to { transform: translate(100px, 100px) scale(1.2); }

        }



        /* Główny Kontener */

        .glass-container {

            max-width: 1000px;

            margin: 100px auto;

            padding: 40px;

            background: rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 40px;

            text-align: center;

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

        }



        h1 {

            font-size: 4rem;

            font-weight: 700;

            background: linear-gradient(to right, #fff, #94a3b8);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 20px;

            letter-spacing: -2px;

        }



        p {

            color: #94a3b8;

            font-size: 1.2rem;

            max-width: 600px;

            margin: 0 auto 40px;

        }



        /* Grid z kartami */

        .grid {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;

            margin-top: 50px;

        }



        .card {

            background: rgba(255, 255, 255, 0.05);

            padding: 30px;

            border-radius: 25px;

            border: 1px solid rgba(255, 255, 255, 0.05);

            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            cursor: pointer;

        }



        .card:hover {

            background: rgba(255, 255, 255, 0.1);

            transform: translateY(-10px);

            border-color: rgba(255, 255, 255, 0.2);

            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);

        }



        .card h3 {

            margin-bottom: 15px;

            font-size: 1.5rem;

            color: #fff;

        }



        /* Przycisk */

        .cta-button {

            display: inline-block;

            padding: 15px 40px;

            background: #fff;

            color: #000;

            text-decoration: none;

            border-radius: 50px;

            font-weight: 700;

            margin-top: 20px;

            transition: 0.3s;

        }



        .cta-button:hover {

            transform: scale(1.05);

            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);

        }



    </style>

</head>

<body>



    <div class="bg-animate">

        <div class="blob"></div>

        <div class="blob-2"></div>

    </div>



    <div class="glass-container">

<a href="index.html" class="cta-button">Powrót na stronę główną</a>



        <div class="grid">

            <div class="card">

                <h3>Stronka</h3>

                <p>Ta o to stronka, na której się w tym momencie znajdujesz.</p>

            </div>

            <div class="card">

                <h3>Bio</h3>

                <p>Na wzór guns.lol lub innych stron typu link-in-bio.</p>

              <a href="https://itspablosiu.github.io/bio/" target="_blank" class="cta-button">Kliknij!</a>

            </div>

            <div class="card">

                <h3>N/A</h3>

                <p>Na razie nie mam nic w planach.</p>

            </div>

        </div>

    </div>



</body>

</html>
